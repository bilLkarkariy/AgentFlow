# Default values for agentflow-infra.
#
# Stateful dependencies of the AgentFlow workloads, all in namespace
# `agentflow` (owned by the platform, never created here).
#
# Every block is behind an `enabled` flag, so the same chart renders:
#   local (kind) : CNPG Cluster + Redis + RabbitMQ + dummy app Secrets
#   aws  (EKS)   : Redis + RabbitMQ only (Postgres comes from RDS, and the
#                  app Secrets come from External Secrets Operator)
#
# None of these pods gets an Istio sidecar (`sidecar.istio.io/inject: "false"`):
# they speak raw TCP, the mesh brings nothing, and a sidecar would only make
# them slower to start and harder to debug. Istio automatic mTLS falls back to
# plaintext when the destination has no sidecar, so the STRICT
# PeerAuthentication of the namespace keeps working for everything else.

# -- Reserved for Helm when this chart is used as a dependency.
global: {}

# -- Base name of the rendered objects. Empty means "use the release name".
nameOverride: ""
# -- Fully overrides the generated names (rarely useful; object names are
# pinned per component below).
fullnameOverride: ""

# -- Extra labels added to every object of the chart.
commonLabels: {}
# -- Extra annotations added to every object of the chart.
commonAnnotations: {}

########################################################################
# PostgreSQL - CloudNativePG Cluster
#
# The operator itself is installed by the `cnpg-operator` Application
# (deploy/argocd/envs/<env>/cnpg-operator.yaml, sync wave -2).
#
# Cluster `agentflow-db` makes the operator create:
#   Services  agentflow-db-rw / agentflow-db-ro / agentflow-db-r
#   Secret    agentflow-db-app  (keys: username, password, host, port,
#                                dbname, pgpass, uri, jdbc-uri, fqdn-uri,
#                                fqdn-jdbc-uri)
# The api consumes `agentflow-db-app` / `uri` as POSTGRES_URL.
########################################################################
postgresql:
  cnpg:
    # -- Render the CNPG Cluster. False on AWS, where Postgres is RDS.
    enabled: true
    # -- Cluster name. Drives every derived object name, do not change it
    # without updating deploy/envs/*/api.yaml (database.existingSecret).
    name: agentflow-db
    # -- Number of instances (1 local, 2 on AWS if CNPG were used there).
    instances: 1
    # -- Postgres image. Empty means "the operator default", which is always
    # a fully tagged image (never `latest`).
    imageName: ""
    # -- unsupervised = the operator performs the switchover on its own.
    primaryUpdateStrategy: unsupervised
    # -- Skip the dry-run when the CRD is not installed yet, so ArgoCD can
    # render the app before the operator lands.
    skipDryRunOnMissingResource: true
    storage:
      # -- Size of the data PVC.
      size: 2Gi
      # -- StorageClass; empty means the cluster default (kind: standard).
      storageClass: ""
    bootstrap:
      initdb:
        # -- Application database created at bootstrap.
        database: agentflow
        # -- Owner role of that database; also the user of `agentflow-db-app`.
        owner: agentflow
        # -- Run once, right after the database is created.
        postInitApplicationSQL:
          - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
    # -- Extra postgresql.conf parameters, passed through verbatim.
    parameters: {}
    monitoring:
      # -- PodMonitor needs the Prometheus Operator CRDs and a matching
      # selector. This platform scrapes by pod annotation instead, so it
      # stays off and the annotations below do the job.
      enablePodMonitor: false
      # -- Port exposed by the CNPG instance manager for /metrics.
      port: 9187
    # -- Applied by the operator to every object it creates for this Cluster
    # (pods, services, PVCs). This is how the pods get scraped and how they
    # opt out of the mesh.
    inheritedMetadata:
      annotations:
        sidecar.istio.io/inject: "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: /metrics
      labels:
        app: postgres
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # -- Annotations of the ServiceAccount generated by the operator
    # (IRSA role ARN when backups to S3 are enabled).
    serviceAccountAnnotations: {}
    # -- Optional PodDisruptionBudget managed by the operator. Off with a
    # single instance, otherwise it blocks node drains for ever.
    enablePDB: false
    backup:
      # -- Continuous WAL archiving to object storage. Off locally; on AWS it
      # needs a real bucket plus the IRSA annotation above.
      enabled: false
      # -- s3://<bucket>/<path>. Replace the placeholder before enabling.
      destinationPath: s3://BUCKET_PLACEHOLDER/agentflow-db
      # -- Custom S3 endpoint (MinIO); empty means the AWS endpoint.
      endpointURL: ""
      # -- Server name inside the bucket; empty means the cluster name.
      serverName: ""
      s3Credentials:
        # -- Use the IRSA role attached to the instance ServiceAccount
        # instead of static keys. Keys are never committed.
        inheritFromIAMRole: true
      wal:
        compression: gzip
      data:
        compression: gzip
      # -- Barman retention, e.g. "7d" / "30d". Empty omits the field.
      retentionPolicy: 7d

########################################################################
# Redis - BullMQ queues and Socket.IO adapter of the api.
# Single instance, AOF persistence, no clustering: this is a demo cache,
# not a datastore.
########################################################################
redis:
  # -- Render the Redis StatefulSet and Services.
  enabled: true
  # -- Object name; the api reaches it at REDIS_HOST=agentflow-redis.
  name: agentflow-redis
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  # -- Service and container port.
  port: 6379
  # -- Arguments appended to `redis-server`.
  args:
    - --appendonly
    - "yes"
    - --dir
    - /data
  persistence:
    # -- False falls back to an emptyDir (data lost on restart).
    enabled: true
    size: 1Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  # -- Extra pod annotations, merged after the no-sidecar annotation.
  podAnnotations: {}
  # -- Extra pod labels.
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

########################################################################
# RabbitMQ - the flow-run work queue shared by the api and the worker.
#
# Single node, management plugin for the dashboard DLQ console, prometheus
# plugin scraped by annotation on port 15692.
########################################################################
rabbitmq:
  # -- Render the RabbitMQ StatefulSet, Services, ConfigMap and Secret.
  enabled: true
  # -- Object name; AMQP URLs point at agentflow-rabbitmq:5672.
  name: agentflow-rabbitmq
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
    pullPolicy: IfNotPresent
  auth:
    # -- Default user created on a blank node.
    username: agentflow
    # -- Password of that user. The default is a throwaway value for kind
    # only: on AWS set `auth.existingSecret` and let ESO own the Secret.
    password: agentflow
    # -- Virtual host. `/` is the RabbitMQ default and the one the URLs use.
    vhost: /
    # -- Name of a Secret that already carries RABBITMQ_DEFAULT_USER,
    # RABBITMQ_DEFAULT_PASS and `url`. When set the chart creates no Secret
    # and no password ever reaches Git.
    existingSecret: ""
  ports:
    amqp: 5672
    management: 15672
    metrics: 15692
  # -- Written verbatim to /etc/rabbitmq/enabled_plugins.
  plugins:
    - rabbitmq_management
    - rabbitmq_prometheus
  # -- Extra lines appended to the generated rabbitmq.conf fragment.
  extraConfig: ""
  definitions:
    # -- Import a definitions.json at boot (load_definitions).
    enabled: true
    # -- Dead letter exchange the DLQ is bound to.
    deadLetterExchange: agentflow.dlx
    # -- Routing key used for the binding; also the app queue name.
    appQueue: agentflow.flow-run
    # -- Queue the dashboard DLQ console points at.
    deadLetterQueue: agentflow.flow-run.dlq
    # -- Declare the *application* queue here as well. Off on purpose: the
    # api asserts `agentflow.flow-run` itself, and a mismatch on durability
    # or on x-arguments makes the api's channel fail with PRECONDITION_FAILED.
    # Only flip this to true once the api asserts the queue with exactly
    # `x-dead-letter-exchange` / `x-dead-letter-routing-key` below.
    declareAppQueue: false
  managementIngress:
    # -- VirtualService publishing the management UI on the shared gateway.
    # Local convenience only; on AWS admin UIs go through `make aws-ui`.
    enabled: false
    # -- External host, e.g. rabbitmq.127.0.0.1.sslip.io.
    host: ""
    gateways:
      - istio-ingress/agentflow-gateway
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  # -- readOnlyRootFilesystem stays false: the official entrypoint writes
  # /etc/rabbitmq/conf.d/10-defaults.conf on every start.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

########################################################################
# Application Secrets - local only.
#
# On AWS these two Secrets are produced by External Secrets Operator from
# AWS Secrets Manager, so `create` is false there and this chart must not
# fight ESO for ownership.
########################################################################
appSecrets:
  # -- Create agentflow-api-secrets and agentflow-worker-secrets.
  create: false
  # -- Name of the Secret consumed by the api (secrets.existingSecret).
  apiSecretName: agentflow-api-secrets
  # -- Name of the Secret consumed by the worker.
  workerSecretName: agentflow-worker-secrets
  # -- Broker URL written to RABBITMQ_URL and CELERY_BROKER_URL. Empty means
  # "derive it from the rabbitmq values above".
  brokerUrl: ""
  # -- Extra key/value pairs added to the api Secret. Dummy values only:
  # a real key belongs in AWS Secrets Manager or in the local `.env` seeded
  # by scripts/seed-local-secrets.sh, never in this file.
  data:
    OPENAI_API_KEY: changeme
  # -- Extra key/value pairs added to the worker Secret.
  workerData: {}
