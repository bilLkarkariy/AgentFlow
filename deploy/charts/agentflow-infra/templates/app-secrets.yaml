{{- if .Values.appSecrets.create }}
{{- $a := .Values.appSecrets }}
{{- $broker := include "agentflow-infra.brokerUrl" . }}
########################################################################
# Application Secrets - LOCAL ONLY.
#
# `appSecrets.create` must stay false on AWS: there the same two Secrets are
# produced by External Secrets Operator from AWS Secrets Manager, and two
# owners for one object means a permanent ArgoCD conflict.
#
# The values here are deliberate dummies. A real OPENAI_API_KEY reaches the
# kind cluster through scripts/seed-local-secrets.sh (namespace
# platform-secrets) and ESO, never through this file.
########################################################################
apiVersion: v1
kind: Secret
metadata:
  name: {{ $a.apiSecretName }}
  labels:
    {{- include "agentflow-infra.labels" (dict "root" . "component" "app-secrets") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  RABBITMQ_URL: {{ $broker | quote }}
  CELERY_BROKER_URL: {{ $broker | quote }}
  {{- range $key, $value := $a.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $a.workerSecretName }}
  labels:
    {{- include "agentflow-infra.labels" (dict "root" . "component" "app-secrets") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  CELERY_BROKER_URL: {{ $broker | quote }}
  {{- range $key, $value := $a.workerData }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
