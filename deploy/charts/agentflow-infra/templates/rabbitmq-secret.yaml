{{- if and .Values.rabbitmq.enabled (not .Values.rabbitmq.auth.existingSecret) }}
{{- $r := .Values.rabbitmq }}
{{- $ctx := dict "root" . "component" "rabbitmq" }}
########################################################################
# RabbitMQ credentials.
#
# Created only when `rabbitmq.auth.existingSecret` is empty, i.e. locally.
# The default agentflow/agentflow pair is a throwaway for kind; on AWS the
# Application sets `auth.existingSecret` and External Secrets Operator owns
# the Secret, so no password is ever committed.
#
# `url` is the derived AMQP connection string. The trailing "//" is the
# URL-encoded default virtual host "/", not a typo.
########################################################################
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r.name }}
  labels:
    {{- include "agentflow-infra.labels" $ctx | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ $r.auth.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ $r.auth.password | quote }}
  RABBITMQ_DEFAULT_VHOST: {{ $r.auth.vhost | default "/" | quote }}
  url: {{ include "agentflow-infra.rabbitmq.url" . | quote }}
{{- end }}
