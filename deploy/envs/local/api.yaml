########################################################################
# agentflow-api - kind (local).
# Layered on deploy/envs/base/api.yaml; only the differences live here.
#
# `image.tag` is bumped automatically by .github/workflows/build-images.yml
# (`yq -i '.image.tag = "sha-<7>"'`). Do not add anything else that must
# track the tag: APP_VERSION is derived from the pod label.
########################################################################

image:
  tag: sha-0000000

# Socket.IO keeps run state in memory, so one replica is the honest default
# on a laptop. The canary still runs: it surges a second pod.
replicaCount: 1

config:
  DEPLOY_ENV: local
  # CloudNativePG serves plaintext inside the cluster.
  POSTGRES_SSL: "false"
  # Sample every trace locally; there is no cost and the demo needs them.
  OTEL_TRACES_SAMPLER_ARG: "1.0"

# Secret generated by CloudNativePG for the `agentflow` role.
database:
  existingSecret: agentflow-db-app
  secretKey: uri

istio:
  virtualService:
    hosts:
      - api.agentflow.test
