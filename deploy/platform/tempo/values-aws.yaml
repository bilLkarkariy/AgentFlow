########################################################################
# Tempo - EKS overrides.
#
# Still local (PVC) storage: 24h of demo traces do not justify an S3
# bucket, a lifecycle policy and one more IRSA role.
########################################################################

replicas: 1

persistence:
  enabled: true
  size: 5Gi
  storageClassName: gp3

tempo:
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      memory: 768Mi
