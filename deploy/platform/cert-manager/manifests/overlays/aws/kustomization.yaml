########################################################################
# cert-manager configuration - EKS overlay.
#
# Two differences with the local overlay:
#
# 1. The root CA is NOT generated in-cluster. It is created once by
#    scripts/aws-bootstrap.sh, stored in Secrets Manager under
#    `agentflow/demo/ca`, and projected into cert-manager/agentflow-root-ca
#    by the ExternalSecret `agentflow-ca` (deploy/platform/external-secrets/
#    manifests/overlays/aws). So the self-signed bootstrap Issuer and the
#    `agentflow-root-ca` Certificate of the base are deleted here: two
#    owners for one Secret is a permanent fight, and a CA regenerated on
#    every `make aws-up` would make `make aws-trust-ca` useless.
#    Only the ClusterIssuer `agentflow-ca` survives, and it reads the
#    Secret ESO wrote.
#
# 2. The wildcard Certificate needs the real domain, which is
#    <eip-with-dashes>.sslip.io and only exists after `terraform apply`.
#    scripts/aws-render-env.sh writes it into wildcard-domain.yaml by key
#    (`.spec.dnsNames`), never by string substitution, so a second
#    provisioning overwrites the previous domain cleanly.
########################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # ------------------------------------------------------------------
  # 1. Drop the in-cluster CA chain; ESO owns the Secret on AWS.
  # ------------------------------------------------------------------
  - target:
      group: cert-manager.io
      version: v1
      kind: Issuer
      name: selfsigned-bootstrap
      namespace: cert-manager
    patch: |
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: selfsigned-bootstrap
        namespace: cert-manager
      $patch: delete

  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: agentflow-root-ca
      namespace: cert-manager
    patch: |
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: agentflow-root-ca
        namespace: cert-manager
      $patch: delete

  # ------------------------------------------------------------------
  # 2. Rendered domain. Kept in its own file so `yq` can address
  #    `.spec.dnsNames` directly instead of rewriting an inline string.
  # ------------------------------------------------------------------
  - path: wildcard-domain.yaml
    target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: agentflow-wildcard-tls
