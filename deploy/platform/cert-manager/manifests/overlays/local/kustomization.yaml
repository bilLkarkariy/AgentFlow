apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Local domain, resolved through /etc/hosts (scripts/hosts-setup.sh).
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: agentflow-wildcard-tls
    patch: |
      - op: replace
        path: /spec/dnsNames
        value:
          - "*.agentflow.test"
          - "agentflow.test"
