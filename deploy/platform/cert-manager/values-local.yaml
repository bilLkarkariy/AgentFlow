########################################################################
# cert-manager - kind overrides.
########################################################################

# Nothing resolves publicly on *.127.0.0.1.sslip.io, and no ACME issuer is used
# locally: keep the DNS-01 recursive resolvers off the default public list.
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  logging:
    verbosity: 1
    format: text

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
