########################################################################
# kube-prometheus-stack - EKS overrides.
#
# Admin UIs are not published on AWS; `make aws-ui` port-forwards them,
# hence the localhost root_url.
########################################################################

prometheus:
  prometheusSpec:
    externalUrl: http://localhost:9090
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi

alertmanager:
  alertmanagerSpec:
    externalUrl: http://localhost:9093

grafana:
  # No password in git on AWS: the Secret is created by External Secrets
  # from Secrets Manager (agentflow/demo/grafana) with keys admin-user and
  # admin-password - see deploy/platform/external-secrets/manifests/
  # overlays/aws/externalsecret-grafana.yaml. `make aws-ui --show` reads
  # the same entry.
  admin:
    existingSecret: agentflow-grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  grafana.ini:
    server:
      # `make aws-ui` forwards Grafana on 3001 (3000 is taken by the SPA
      # dev servers); scripts/aws-ui.sh owns that number.
      root_url: http://localhost:3001
      serve_from_sub_path: false
