########################################################################
# Mesh-wide mTLS. A PeerAuthentication named `default` in the mesh root
# namespace (istio-system) applies to every workload.
#
# Consequence to demo: `kubectl run curl --image=curlimages/curl` in the
# agentflow namespace without a sidecar cannot reach agentflow-api.
########################################################################
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
