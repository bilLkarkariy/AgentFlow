########################################################################
# Kyverno - EKS overrides.
#
# Same single-replica footprint (2x t4g.large Spot), but the webhooks
# keep their default `Fail` policy: on AWS the whole point of the demo is
# that `verify-image-signatures` runs in Enforce mode and cannot be
# bypassed by taking the admission controller down.
########################################################################

admissionController:
  container:
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi

backgroundController:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
