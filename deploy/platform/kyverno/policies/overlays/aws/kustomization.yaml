########################################################################
# Kyverno policies - EKS overlay.
#
# Every image in the agentflow namespace comes from GHCR and was signed by
# a GitHub Actions workflow of this repository, so signature verification
# is a hard gate: an unsigned or foreign-signed image is rejected at
# admission and its tag is rewritten to the verified digest.
#
# The patch restates what base already says. That is deliberate: the two
# overlays then read as a pair, and a change to the base default cannot
# silently downgrade production.
########################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: verify-image-signatures
    patch: |
      - op: replace
        path: /spec/rules/0/verifyImages/0/failureAction
        value: Enforce
      - op: replace
        path: /spec/rules/0/verifyImages/0/mutateDigest
        value: true
