########################################################################
# Demonstration ExternalSecret (kind only).
#
# Locally the two Secrets the app actually consumes
# (`agentflow-api-secrets`, `agentflow-worker-secrets`) are created
# directly by the infra chart (`appSecrets.create: true`, WP5) so that a
# fresh `make local-up` works before ESO is even healthy.
#
# This object therefore proves the *pattern*, not the wiring: it reads the
# seeded Secret `platform-secrets/agentflow-demo-app` through the
# ClusterSecretStore and materialises `agentflow/agentflow-app-external`.
#
#   kubectl -n agentflow get externalsecret     -> SecretSynced
#   kubectl -n agentflow get secret agentflow-app-external -o yaml
#
# On EKS the aws overlay drops this object and instead owns
# `agentflow-api-secrets` / `agentflow-worker-secrets` for real; the infra
# chart is then deployed with `appSecrets.create: false`.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-api-secrets-external
  namespace: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-app-external
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    # `extract` copies every key of the remote Secret as-is, so a new
    # OAuth variable added to .env shows up without touching this file.
    - extract:
        key: agentflow-demo-app
