########################################################################
# ClusterSecretStore `agentflow` - kind.
#
# There is no cloud secret manager on a laptop, so the store points at the
# cluster itself: namespace platform-secrets is the "vault", and
# scripts/seed-local-secrets.sh fills it from the developer's .env
# (Secret `agentflow-demo-app`).
#
# The contract seen by an ExternalSecret is identical to the AWS one
# (`kind: ClusterSecretStore, name: agentflow`), which is the whole point:
# the same ExternalSecret shape works in both environments, only the
# provider block changes.
########################################################################
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: agentflow
  annotations:
    # The CRD arrives with the chart at wave 15 and this object syncs at
    # wave 16; ArgoCD's dry-run can still hit the API server before the
    # CRD is established.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      # The only namespace this store can ever read.
      remoteNamespace: platform-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          # Every namespace gets this ConfigMap from the API server; it
          # holds the cluster CA that signs the API server certificate.
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: platform-secrets
          key: ca.crt
      auth:
        # Impersonate the least-privileged reader from base/rbac.yaml
        # rather than using the operator's own (cluster-wide) rights.
        serviceAccount:
          name: eso-reader
          namespace: platform-secrets
