########################################################################
# agentflow-worker-secrets (ns agentflow) - EKS.
#
# The Celery worker only needs the broker URL (plan section 5), so it gets
# exactly that: no `dataFrom` on agentflow/demo/app, which means none of
# the OpenAI or OAuth material ever reaches the worker's environment.
#
# The URL is the `url` field of the JSON document agentflow/demo/rabbitmq
# written by infra/envs/aws-demo, so it carries the generated broker
# password and never appears in Git. If IRSA or the store breaks, the
# ExternalSecret goes SecretSyncedError instead of quietly publishing a
# stale hard-coded value forever.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-worker-secrets
  namespace: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-worker-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: agentflow/demo/rabbitmq
        property: url
