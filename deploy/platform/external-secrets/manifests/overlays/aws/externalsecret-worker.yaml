########################################################################
# agentflow-worker-secrets (ns agentflow) - EKS.
#
# The Celery worker only needs the broker URL (plan section 5).
#
# The remote secret is still fetched: it makes the ExternalSecret fail
# loudly (SecretSyncedError) if IRSA or the store breaks, instead of
# quietly publishing a hard-coded value forever. `mergePolicy` is left at
# its default (Replace), so the resulting Secret holds exactly the one key
# rendered by the template - none of the OpenAI/OAuth material reaches the
# worker.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-worker-secrets
  namespace: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-worker-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        # PLACEHOLDER - see externalsecret-api.yaml; WP13 finalises this.
        CELERY_BROKER_URL: "amqp://agentflow:agentflow@agentflow-rabbitmq:5672//"
  dataFrom:
    - extract:
        key: agentflow/demo/app
