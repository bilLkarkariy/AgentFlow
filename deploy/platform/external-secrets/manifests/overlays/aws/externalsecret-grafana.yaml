########################################################################
# agentflow-grafana-admin (ns observability) - EKS.
#
# Locally Grafana runs with admin/admin. On AWS the UI is only reachable
# through `make aws-ui` (port-forward), but the password still must not be
# in Git: infra/envs/aws-demo generates it and stores
# agentflow/demo/grafana = {"admin-user", "admin-password"}.
#
# The key names match `grafana.admin.{userKey,passwordKey}` in
# deploy/platform/kube-prometheus-stack/values-aws.yaml, which points at
# `existingSecret: agentflow-grafana-admin`.
#
# `make aws-ui --show` reads the same Secrets Manager entry, so the
# operator never has to base64-decode anything out of the cluster.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: agentflow/demo/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: agentflow/demo/grafana
        property: admin-password
