########################################################################
# agentflow-api-secrets (ns agentflow) - EKS.
#
# Replaces the Secret that the infra chart creates locally: on AWS the
# infra chart runs with `appSecrets.create: false` and this ExternalSecret
# owns the object.
#
# Contract (plan section 5): OPENAI_API_KEY, RABBITMQ_URL,
# CELERY_BROKER_URL, plus the optional OAuth keys copied wholesale.
#
#   dataFrom.extract  -> every key of agentflow/demo/app (OPENAI_API_KEY,
#                        GOOGLE_CLIENT_ID, ...) exactly as stored
#   data              -> the broker URL, pulled out of the JSON document
#                        agentflow/demo/db's sibling agentflow/demo/rabbitmq
#                        (keys username, password, url) which Terraform
#                        writes with a generated password
#
# No credential is templated in this file any more: rotating the RabbitMQ
# password in Secrets Manager is enough, ESO republishes within
# `refreshInterval` and nothing in Git changes.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-api-secrets
  namespace: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  # `data` wins over `dataFrom` on a key collision, which is what we want:
  # a stale RABBITMQ_URL left in agentflow/demo/app can never shadow the
  # generated one.
  data:
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: agentflow/demo/rabbitmq
        property: url
    - secretKey: CELERY_BROKER_URL
      remoteRef:
        key: agentflow/demo/rabbitmq
        property: url
  dataFrom:
    - extract:
        key: agentflow/demo/app
