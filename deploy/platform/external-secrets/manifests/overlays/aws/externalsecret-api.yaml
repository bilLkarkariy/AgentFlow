########################################################################
# agentflow-api-secrets (ns agentflow) - EKS.
#
# Replaces the Secret that the infra chart creates locally: on AWS the
# infra chart runs with `appSecrets.create: false` and this ExternalSecret
# owns the object.
#
# Contract (plan section 5): OPENAI_API_KEY, RABBITMQ_URL,
# CELERY_BROKER_URL, plus the optional OAuth keys copied wholesale.
#
#   dataFrom.extract  -> every key of agentflow/demo/app (OPENAI_API_KEY,
#                        GOOGLE_CLIENT_ID, ...) exactly as stored
#   template + Merge  -> adds the two broker URLs on top
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-api-secrets
  namespace: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # Merge: keep everything dataFrom produced and add the keys below.
      mergePolicy: Merge
      data:
        # PLACEHOLDER - RabbitMQ runs in-cluster with the dummy credentials
        # of the infra chart. WP13 (aws-lifecycle) replaces both lines with
        # a lookup of a real credential in Secrets Manager once RabbitMQ is
        # deployed with a generated password.
        RABBITMQ_URL: "amqp://agentflow:agentflow@agentflow-rabbitmq:5672//"
        CELERY_BROKER_URL: "amqp://agentflow:agentflow@agentflow-rabbitmq:5672//"
  dataFrom:
    - extract:
        key: agentflow/demo/app
