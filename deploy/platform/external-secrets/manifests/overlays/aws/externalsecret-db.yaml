########################################################################
# agentflow-db (ns agentflow) - EKS.
#
# Locally the database is CloudNativePG and the connection string comes
# from the CNPG-generated Secret `agentflow-db-app` (key `uri`). On AWS the
# database is RDS, Terraform writes the URL into Secrets Manager under
# agentflow/demo/db as JSON {"url": "postgres://..."} and ESO projects it
# under the key the API expects (plan section 5).
#
# POSTGRES_SSL is a literal: RDS enforces TLS, kind does not.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-db
  namespace: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        POSTGRES_SSL: "true"
  data:
    - secretKey: POSTGRES_URL
      remoteRef:
        key: agentflow/demo/db
        # Pull one field out of the JSON document rather than the whole
        # blob, so a rotation of the RDS password does not reshape the key.
        property: url
