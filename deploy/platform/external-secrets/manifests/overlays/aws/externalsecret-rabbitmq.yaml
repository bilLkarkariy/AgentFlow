########################################################################
# agentflow-rabbitmq (ns agentflow) - EKS.
#
# RabbitMQ stays in-cluster on AWS (plan section 2), but its password is
# not a dummy any more: infra/envs/aws-demo generates it and writes
# agentflow/demo/rabbitmq = {"username", "password", "url"} into Secrets
# Manager. This ExternalSecret projects the three fields under the exact
# key names the infra chart expects from `rabbitmq.auth.existingSecret`
# (deploy/envs/aws/infra.yaml):
#
#   RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS  -> the broker container
#   url                                            -> the AMQP URL clients
#                                                     use, kept next to the
#                                                     credentials so there
#                                                     is one source of truth
#
# The same `url` field feeds agentflow-api-secrets and
# agentflow-worker-secrets, so a rotation moves every consumer at once.
#
# Ordering note: the StatefulSet cannot start before this Secret exists.
# The ExternalSecret syncs at platform wave 16, the agentflow workloads at
# waves 20+, so ESO always wins the race; if it ever does not, the pod
# simply stays Pending on a missing Secret and recovers by itself.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-rabbitmq
  namespace: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-rabbitmq
    creationPolicy: Owner
    # A pruned Application must not take the broker credentials with it:
    # the StatefulSet would come back up unable to read its own mnesia
    # database.
    deletionPolicy: Retain
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: agentflow/demo/rabbitmq
        property: username
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: agentflow/demo/rabbitmq
        property: password
    - secretKey: url
      remoteRef:
        key: agentflow/demo/rabbitmq
        property: url
