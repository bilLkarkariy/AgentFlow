########################################################################
# agentflow-ca (ns cert-manager) - EKS.
#
# The demo CA must survive `make aws-down` / `make aws-up`: the browser
# (and `make aws-trust-ca`) trusts one CA, not a new self-signed one per
# session. scripts/aws-bootstrap.sh generates it once and stores it in
# Secrets Manager under agentflow/demo/ca as {"tls.crt": ..., "tls.key": ...}.
#
# The target Secret is `agentflow-root-ca` because that is what
# ClusterIssuer/agentflow-ca reads (deploy/platform/cert-manager/manifests/
# base/root-ca.yaml, `clusterResourceNamespace: cert-manager`).
#
# !! Requires a matching change in the cert-manager aws overlay (owned by
# !! WP7): the self-signed `agentflow-root-ca` Certificate and the
# !! `selfsigned-bootstrap` Issuer must be removed there, otherwise
# !! cert-manager and ESO both claim the same Secret. WP7 already left the
# !! TODO in deploy/platform/cert-manager/manifests/overlays/aws.
########################################################################
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentflow-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: agentflow
  target:
    name: agentflow-root-ca
    creationPolicy: Owner
    # Never let a pruned Application take the CA private key with it.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # cert-manager only accepts a CA issuer secret of this type.
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: agentflow/demo/ca
