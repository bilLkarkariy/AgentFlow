########################################################################
# ClusterSecretStore `agentflow` - EKS.
#
# Same name and kind as the kind-cluster store, so every ExternalSecret is
# environment-agnostic. Only the provider block differs.
#
# Authentication is IRSA: the operator's ServiceAccount carries the
# annotation eks.amazonaws.com/role-arn (values-aws.yaml), the EKS OIDC
# provider exchanges its projected token for STS credentials, and the
# `agentflow-demo-eso` role's policy is scoped to
# arn:aws:secretsmanager:eu-west-1:<account>:secret:agentflow/demo/*.
# No static AWS key exists anywhere in this repo or in the cluster.
########################################################################
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: agentflow
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
