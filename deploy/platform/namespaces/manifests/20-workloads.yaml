---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    app.kubernetes.io/part-of: agentflow-platform
    agentflow.io/layer: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentflow
  labels:
    app.kubernetes.io/part-of: agentflow-platform
    agentflow.io/layer: workloads
    # Every workload pod gets an Istio sidecar (mTLS STRICT, canary routing).
    istio-injection: enabled
    # Warn only: the istio-init container needs NET_ADMIN, so `restricted`
    # cannot be enforced while running the sidecar dataplane. On EKS the
    # istio-cni component removes that init container.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
