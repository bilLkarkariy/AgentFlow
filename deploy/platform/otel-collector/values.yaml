########################################################################
# OpenTelemetry Collector - trace gateway (wave 10).
# Chart: open-telemetry/opentelemetry-collector 0.172.1.
#
# Single hop between the applications and Tempo:
#   api  --OTLP/http:4318-->  otel-collector  --OTLP/gRPC:4317-->  tempo
#   istio-proxy (extensionProvider otel-tracing) --OTLP/gRPC:4317-->
#
# fullnameOverride pins the Service name to `otel-collector`, which is
# what OTEL_EXPORTER_OTLP_ENDPOINT and the istiod extensionProvider point
# at (plan section 5).
########################################################################

mode: deployment
replicaCount: 1
fullnameOverride: otel-collector

image:
  # k8s distribution: OTLP receivers, k8sattributes, batch, memory_limiter.
  # Smaller and better maintained than -contrib for this pipeline.
  repository: otel/opentelemetry-collector-k8s

presets:
  # Adds the k8sattributes processor to every pipeline and the RBAC it
  # needs, so spans arrive in Grafana already carrying k8s.namespace.name,
  # k8s.pod.name and friends. Those two attributes are what Tempo's
  # tracesToLogsV2 uses to jump to the matching Loki stream.
  kubernetesAttributes:
    enabled: true

########################################################################
# Ports: OTLP only. Jaeger and Zipkin are not used anywhere in AgentFlow.
########################################################################
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    # The collector's own telemetry, scraped through the pod annotations
    # below rather than a ServiceMonitor.
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

########################################################################
# Pipeline.
########################################################################
config:
  receivers:
    # Drop the receivers whose ports are disabled above.
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      # Percentages of the container memory limit (256Mi below).
      limit_percentage: 75
      spike_limit_percentage: 25
    batch:
      timeout: 5s
      send_batch_size: 1024
      send_batch_max_size: 2048

  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
      retry_on_failure:
        enabled: true
      sending_queue:
        enabled: true
        queue_size: 1000
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - otlp/tempo
          - debug
      # Metrics and logs go to Prometheus and Loki by other routes; the
      # chart's default pipelines are removed rather than left dangling.
      metrics: null
      logs: null

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: /metrics

serviceMonitor:
  enabled: false
podMonitor:
  enabled: false
