########################################################################
# Loki - log store (wave 10).
# Chart: grafana/loki 7.3.0 (Loki 3.6.x), see deploy/versions.yaml.
#
# SingleBinary: one pod, one PVC, filesystem storage. Sized for a demo
# cluster, not for retention or throughput. Alloy (DaemonSet) pushes to
# http://loki.observability.svc.cluster.local:3100 with the gateway off.
########################################################################

deploymentMode: SingleBinary

loki:
  # Single tenant: no X-Scope-OrgID anywhere (Alloy, Grafana, Kiali).
  auth_enabled: false

  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 24h
    # Needed by Loki 3.x for structured metadata and pattern queries.
    allow_structured_metadata: true
    volume_enabled: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16

  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
    retention_delete_delay: 1h
    compaction_interval: 10m

  # Pattern mining is not part of the demo and costs memory.
  pattern_ingester:
    enabled: false

  ingester:
    chunk_encoding: snappy

  querier:
    max_concurrent: 2

  analytics:
    reporting_enabled: false

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    prometheus.io/path: /metrics

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

########################################################################
# Everything the SimpleScalable / Distributed modes would deploy.
########################################################################
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# No nginx in front: Alloy and Grafana talk to the Loki Service directly.
gateway:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

minio:
  enabled: false

########################################################################
# Loki's own monitoring: scraped by the annotated-pods ScrapeConfig,
# so no ServiceMonitor and no self-monitoring stack.
########################################################################
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
