########################################################################
# Loki - EKS overrides.
#
# Chunks go to S3 through IRSA; nothing here holds a credential.
#
# RENDERED: the bucket name, the region and the IRSA role ARN carry the
# account id, so scripts/aws-render-env.sh writes them from the Terraform
# outputs `loki_bucket`, `region` and `loki_role_arn` and aws-up.sh commits
# the result. The assignment is by yq key path, so re-provisioning into a
# different account just overwrites them.
#
# The literals below are placeholders that keep
# `helm template -f values-aws.yaml` runnable in CI without AWS.
########################################################################

loki:
  storage:
    type: s3
    bucketNames:
      # RENDERED - Terraform output `loki_bucket`, which is
      # agentflow-demo-loki-<account_id>: S3 names are global.
      chunks: agentflow-demo-loki
      ruler: agentflow-demo-loki
    s3:
      # RENDERED - Terraform output `region`.
      region: eu-west-1
      s3ForcePathStyle: false
      insecure: false

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    # A week of logs on AWS: the demo runs over several sessions.
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: s3

serviceAccount:
  create: true
  annotations:
    # RENDERED - Terraform output `loki_role_arn`. An IAM role ARN is an
    # identifier, not a credential: the trust policy is what grants access.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/agentflow-demo-loki

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      memory: 1Gi
