########################################################################
# Loki - EKS overrides.
#
# Chunks go to S3 through IRSA; nothing here holds a credential.
# PLACEHOLDERS: the bucket name and the role ARN are filled in by
# infra/envs/aws-demo (WP12) before this file is used for real. They are
# left as literals so `helm template -f values-aws.yaml` stays runnable
# in CI without AWS.
########################################################################

loki:
  storage:
    type: s3
    bucketNames:
      chunks: agentflow-demo-loki
      ruler: agentflow-demo-loki
    s3:
      region: eu-west-1
      s3ForcePathStyle: false
      insecure: false

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    # A week of logs on AWS: the demo runs over several sessions.
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: s3

serviceAccount:
  create: true
  annotations:
    # PLACEHOLDER - replaced with the IRSA role created for Loki.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/agentflow-demo-loki

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      memory: 1Gi
