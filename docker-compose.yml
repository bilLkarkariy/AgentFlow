# Local development stack. Build context is the repo root for every image.
#   docker compose up -d --build

x-api-image: &api-image
  image: agentflow-api:local
  build:
    context: .
    dockerfile: api/Dockerfile

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  # One-shot: brings the schema up to date, then exits. The api waits for it.
  migrate:
    <<: *api-image
    restart: 'no'
    command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/src/data-source.js']
    environment:
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/postgres
      - POSTGRES_SSL=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/postgres
      - POSTGRES_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    networks:
      - default

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - API_URL=http://api:3000
      - METRICS_PORT=9100
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '9100:9100'
    networks:
      - default

  studio:
    build:
      context: .
      dockerfile: web/studio/Dockerfile
    restart: unless-stopped
    environment:
      - APP_API_BASE_URL=http://localhost:3000
    ports:
      - '5174:8080'
    networks:
      - default

  dashboard:
    build:
      context: .
      dockerfile: web/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      - APP_API_BASE_URL=http://localhost:3000
    ports:
      - '5173:8080'
    networks:
      - default

networks:
  default:
    name: agentflow-dev

volumes:
  postgres_data:
  rabbitmq_data:
