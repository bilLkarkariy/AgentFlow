########################################################################
# Application CI: lint, build, unit and e2e tests for the pnpm workspace
# plus the two Python test suites.
#
# `paths-ignore` keeps this workflow off pure-GitOps and documentation
# commits (deploy/**, infra/**, docs/**, *.md). Those are covered by
# deploy-validate.yml and terraform-ci.yml instead.
########################################################################
name: CI

on:
  push:
    branches:
      - main
      - platform
      - 'feature/**'
    paths-ignore:
      - 'deploy/**'
      - 'infra/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'deploy/**'
      - 'infra/**'
      - 'docs/**'
      - '**/*.md'

# One run per ref: a new push supersedes the one still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  lint-and-test:
    name: Lint, build and test (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm first: setup-node's `cache: pnpm` needs pnpm on the PATH.
      # action-setup@v4 reads the version from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The api e2e suite runs against in-memory SQLite, but the Nest bootstrap
      # still opens Redis/RabbitMQ connections, so the compose backing services
      # stay up for the whole job. Only these three services are started: the
      # application services in the same file would trigger image builds.
      - name: Start backing services
        run: docker compose -f docker-compose.yml up -d postgres redis rabbitmq

      - name: Wait for backing services
        run: |
          set -euo pipefail
          wait_for() {
            svc="$1"
            shift
            deadline=$(( SECONDS + 120 ))
            until docker compose exec -T "$svc" "$@" > /dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::${svc} was not ready after 120s"
                docker compose logs --tail=80 "$svc" || true
                return 1
              fi
              sleep 2
            done
            echo "${svc} is ready"
          }
          wait_for postgres pg_isready -U postgres
          wait_for redis redis-cli ping
          wait_for rabbitmq rabbitmq-diagnostics -q ping

      - name: Lint
        run: pnpm lint

      - name: Build api
        run: pnpm --filter @agentflow/api run build

      - name: Build dashboard
        run: pnpm --filter dashboard run build

      - name: Build studio
        run: pnpm --filter studio run build

      - name: Unit tests (api)
        run: pnpm --filter @agentflow/api run test:unit

      - name: Unit tests (studio)
        run: pnpm --filter studio run test:unit

      - name: E2E tests (api)
        env:
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          NODE_OPTIONS: --max-old-space-size=2048
        run: pnpm --filter @agentflow/api run test:e2e -- --runInBand

      - name: Stop backing services
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans

  python-tests:
    name: Pytest (api/python and worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/python/requirements*.txt
            worker/requirements*.txt

      # Two virtualenvs: the agent runners pull the openai-agents stack while
      # the worker pins celery, and a single environment would have them fight
      # over shared transitive dependencies. The pip download cache is shared.
      - name: Test api/python
        working-directory: api/python
        env:
          OPENAI_API_KEY: dummy
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/venv-api-python"
          python -m venv "$venv"
          "${venv}/bin/python" -m pip install --upgrade pip
          "${venv}/bin/pip" install -r requirements-dev.txt
          "${venv}/bin/pytest" -q

      - name: Test worker
        working-directory: worker
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/venv-worker"
          python -m venv "$venv"
          "${venv}/bin/python" -m pip install --upgrade pip
          "${venv}/bin/pip" install -r requirements-dev.txt
          "${venv}/bin/pytest" -q
